# Decap CMS — SD Negeri 1 Gerduren
# PENTING: ganti <repo> dan <project> di bawah setelah repo GitHub & proyek Cloudflare Pages Git dibuat.
# Jangan pernah menulis GITHUB_CLIENT_SECRET di file ini.
backend:
  name: github
  repo: anggerukmo01-eng/sdn1gerduren-website
  branch: main
  base_url: https://sdn1gerduren.pages.dev
  auth_endpoint: /api/auth
media_folder: images/uploads
public_folder: /images/uploads
collections:
  - name: berita
    label: Berita
    files:
      - name: daftar
        label: Daftar Berita
        file: content/berita.json
        fields:
          - label: Daftar Berita
            name: berita
            widget: list
            fields:
              - { label: Judul, name: judul, widget: string }
              - { label: Tanggal, name: tanggal, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
              - { label: Kategori, name: kategori, widget: select, options: [Berita, Pengumuman, Kegiatan], default: Berita, required: false }
              - { label: Penulis, name: penulis, widget: string, required: false, default: Admin }
              - { label: Ringkasan, name: ringkasan, widget: text }
              - { label: Isi Lengkap, name: isi, widget: markdown, required: false }
              - { label: Foto, name: foto, widget: image, required: false }
